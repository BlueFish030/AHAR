name: Build and Test

on:
  push:
    branches: [main, IMU, feature/npm-library-v1]
  pull_request:
    branches: [main, IMU]
  workflow_dispatch:

env:
  EMSDK_VERSION: 3.1.50

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache emsdk
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install ${{ env.EMSDK_VERSION }}
          ./emsdk activate ${{ env.EMSDK_VERSION }}

      - name: Activate Emscripten
        run: |
          cd emsdk
          ./emsdk activate ${{ env.EMSDK_VERSION }}
          echo "${{ github.workspace }}/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=${{ github.workspace }}/emsdk" >> "$GITHUB_ENV"

      - name: Verify emcc
        run: |
          source emsdk/emsdk_env.sh
          emcc -v

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ninja-build

      - name: Cache native deps
        uses: actions/cache@v4
        with:
          path: src/libs/build
          key: ahar-libs-v7-${{ hashFiles('src/libs/build.sh', 'src/libs/**/CMakeLists.txt', 'src/libs/obindex2/lib/**') }}
          restore-keys: ahar-libs-v7-

      - name: Build native dependencies
        run: |
          source emsdk/emsdk_env.sh
          export EMSDK="${{ github.workspace }}/emsdk"
          cd src/libs
          if [ -f build/opencv/lib/libopencv_core.a ] && [ ! -f build/opencv/OpenCVConfig.cmake ]; then
            bash ./build.sh opencv-config
          fi
          if [ ! -f build/opengv/lib/libopengv.a ]; then
            bash ./build.sh
          fi
          test -f build/opencv/OpenCVConfig.cmake
          test -f build/opengv/lib/libopengv.a

      - name: Build WASM
        run: |
          source emsdk/emsdk_env.sh
          export EMSDK="${{ github.workspace }}/emsdk"
          mkdir -p src/slam/build
          cd src/slam/build
          emcmake cmake ..
          emmake make install
          cd ../../..
          node scripts/sync-post-js.js
          node scripts/copy-wasm.js

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: alva_ar_js
          path: |
            dist/alva_ar.js
            packages/core/dist/alva_ar.js

  test-js:
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: alva_ar_js
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Verify WASM exports
        run: |
          node -e "
          const fs = require('fs');
          const s = fs.readFileSync('dist/alva_ar.js','utf8');
          const wasm = s.slice(0, s.indexOf('class SharedMemory'));
          for (const fn of ['getMapPoints3D','findPlaneAt','createAnchor']) {
            if (!wasm.includes(fn)) throw new Error('WASM missing export: ' + fn);
          }
          console.log('WASM export check OK');
          "

      - name: Verify API version
        run: node scripts/verify-api-version.js

      - name: Lint
        run: npm run lint

      - name: npm pack smoke test
        run: |
          npm pack -w @bluefish030/ahar-slam --pack-destination /tmp
          tar tf /tmp/bluefish030-ahar-slam-*.tgz | grep dist/alva_ar.js

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-wasm, test-js]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: alva_ar_js
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Publish packages
        run: |
          npm publish -w @bluefish030/ahar-slam --access public
          npm publish -w @bluefish030/ahar-slam-three --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
